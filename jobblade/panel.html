<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JobBlade Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="panel.css?v=2026-06-01-5" />
</head>
<body>
  <div class="jb-shell">
    <div class="jb-header">
      <div>
        <div class="jb-eyebrow">Local vacancy evaluator</div>
        <h1>JobBlade</h1>
      </div>
      <button type="button" class="jb-close" id="closeBtn" aria-label="Close JobBlade">×</button>
    </div>

    <p class="jb-subtitle">Analyze the job you’re viewing without losing the verdict. The result stays here until you close the panel.</p>

    <label class="jb-label" for="resumeSelect">Resume profile</label>
    <select id="resumeSelect" class="jb-select">
      <option value="business_analyst.md">Business Analyst</option>
      <option value="data_analyst.md">Data Analyst</option>
      <option value="bi_analyst.md">BI Analyst</option>
    </select>

    <label class="jb-label" for="modelInput">Ollama model</label>
    <input id="modelInput" class="jb-input" value="qwen2.5:7b" />

    <button type="button" id="analyzeBtn" class="jb-primary">Analyze selected vacancy</button>

    <div id="status" class="jb-status" aria-live="polite"></div>
    <pre id="result" class="jb-result"></pre>
  </div>

  <script src="panel.js?v=2026-06-01-5"></script>
</body>
</html>
